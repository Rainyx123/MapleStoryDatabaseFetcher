name: Daily Maple Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 點執行（台灣時間早上 8 點）
  workflow_dispatch:      # 支援手動觸發

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 賦予 Git 寫入權限，以便自動更新 JSON 檔案

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: python scraper.py

      # 新增這一步：執行資料轉換腳本
      - name: Convert JSON to Excel
        run: python json_to_excel.py

      - name: Commit and push if data changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # 這裡必須同時加入 json 與 excel 檔！
          git add character_data.json character_data_formatted.xlsx
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update data and Excel: $(date +'%Y-%m-%d')" && git push)
